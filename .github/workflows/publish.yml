name: Test and publish
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go test -run '^$' -bench . -benchmem ./...
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/krabdo/doh-relay
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Pull and smoke test published image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/krabdo/doh-relay@${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE"
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format 'Uncompressed size: {{.Size}} bytes'
          docker run -d --name relay -p 127.0.0.1:8080:8080 -e UPSTREAM_URL=https://cloudflare-dns.com/dns-query "$IMAGE"
          trap 'docker rm -f relay' EXIT
          python3 .github/smoke.py
          test "$(docker logs relay 2>&1 | wc -l)" -eq 1
          echo "Published: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
